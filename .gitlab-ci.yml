# See https://docs.gitlab.com/ce/ci/yaml/README.html for the documentation

stages:
  - test
  - build

.only-default: &only-default
  only:
    - master
    - merge_requests


test:
  <<: *only-default
  image: debian:10
  stage: test
  before_script:
    - apt-get update
    - apt-get install --yes python3-pip
    - pip3 install -r requirements.txt
  script:
    - ./build-documentation.sh
  artifacts:
    when: always
    paths:
      - sphinx-output.log
      - build

build:
  <<: *only-default
  stage: build
  script:
    - mv build public/
  artifacts:
    paths:
    - public
